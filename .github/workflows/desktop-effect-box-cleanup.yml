name: Clean desktop effect boxes and controls

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove desktop effect boxes
        run: python3 scripts/remove-desktop-effect-boxes.py

      - name: Finalize compact effect layout
        run: python3 scripts/finalize-desktop-effects-v3.py

      - name: Add more compact desktop effects
        run: python3 scripts/add-desktop-effects-v4.py

      - name: Remove watermark controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* DUSKREEL DESKTOP WATERMARK REMOVED V1 */'
          if marker not in s:
              patch = '''<style>\n/* DUSKREEL DESKTOP WATERMARK REMOVED V1 */\n@media (min-width:761px){\n  #watermarkControls,.watermark-controls,#watermarkPanel,.watermark-panel,#watermarkBtn{display:none !important;}\n}\n</style>\n<script>\n(function(){\n  function removeWatermarkUI(){\n    document.querySelectorAll('#watermarkControls,.watermark-controls,#watermarkPanel,.watermark-panel,#watermarkBtn').forEach(function(el){el.remove();});\n    document.querySelectorAll('button').forEach(function(b){\n      if ((b.textContent||'').trim().toLowerCase() === 'watermark') b.remove();\n    });\n  }\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',removeWatermarkUI,{once:true});\n  else removeWatermarkUI();\n  setTimeout(removeWatermarkUI,500);\n  setTimeout(removeWatermarkUI,1500);\n})();\n</script>\n'''
              s = s.replace('</head>', patch + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          print('Desktop watermark UI removed')
          PY

      - name: Commit generated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Remove watermark controls from desktop editor"
            git push
          fi
