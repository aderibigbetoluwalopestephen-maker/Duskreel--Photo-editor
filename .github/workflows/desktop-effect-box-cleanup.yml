name: Clean desktop effect boxes and controls

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove desktop effect boxes
        run: python3 scripts/remove-desktop-effect-boxes.py

      - name: Add compact desktop effects and watermark controls
        run: python3 scripts/add-desktop-effects-and-watermark.py

      - name: Finalize compact effect layout
        run: python3 scripts/finalize-desktop-effects-v3.py

      - name: Add more compact desktop effects
        run: python3 scripts/add-desktop-effects-v4.py

      - name: Commit generated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add many more compact desktop effects"
            git push
          fi
