name: Clean desktop effect boxes and controls

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove desktop effect boxes
        run: python3 scripts/remove-desktop-effect-boxes.py

      - name: Finalize compact effect layout
        run: python3 scripts/finalize-desktop-effects-v3.py

      - name: Add more compact desktop effects
        run: python3 scripts/add-desktop-effects-v4.py

      - name: Add optional user-controlled watermark
        run: python3 scripts/add-desktop-watermark-controls.py

      - name: Compact presets and clean old effect boxes
        run: python3 scripts/compact-desktop-presets-and-clean-effects.py

      - name: Restore visible presets and watermark controls
        run: python3 scripts/restore-desktop-presets-watermark-v2.py

      - name: Make presets 1x1 like Crop tools
        run: python3 scripts/make-desktop-presets-1x1.py

      - name: Apply final preset and upload fix
        run: python3 scripts/final-desktop-preset-upload-fix.py

      - name: Commit generated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix desktop presets and image upload"
            git push
          fi
