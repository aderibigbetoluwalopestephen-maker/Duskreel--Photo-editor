name: One-time image import compatibility update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-image-import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update image importer
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = """el('photoInput').addEventListener('change', e => addPhotos(e.target.files));

const dropZone = el('stage');"""
          new = """el('photoInput').addEventListener('change', e => {
  addPhotos(e.target.files);
  // Allow selecting the same file again after processing it.
  e.target.value = '';
});

// Clipboard paste: screenshots and copied image files can be imported directly.
document.addEventListener('paste', e => {
  const items = [...(e.clipboardData?.items || [])];
  const pastedImages = items
    .filter(item => item.kind === 'file' && item.type.startsWith('image/'))
    .map(item => item.getAsFile())
    .filter(Boolean);
  if (pastedImages.length) {
    e.preventDefault();
    addPhotos(pastedImages);
  }
});

const dropZone = el('stage');"""

          old2 = """function addPhotos(fileList){
  [...fileList].forEach(file=>{
    if(!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      const img = new Image();
      img.onload = ()=>{
        state.photos.push({id: crypto.randomUUID(), name:file.name, img, spots:[], crop:null, edit:DEFAULT_EDIT()});
        if(state.activeIndex===-1) state.activeIndex = 0;
        renderThumbs();
        renderStageVisibility();
        render();
        pushHistory();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}"""
          new2 = """const COMMON_IMAGE_EXTENSIONS = new Set([
  'jpg','jpeg','jpe','jfif','png','webp','gif','bmp','dib','avif','svg','svgz',
  'ico','tif','tiff','heic','heif','apng','jxl','jp2','j2k','jpf','jpm','jpx'
]);

function isImageFile(file){
  if(!file) return false;
  if(typeof file.type === 'string' && file.type.toLowerCase().startsWith('image/')) return true;
  const name = String(file.name || '').toLowerCase();
  const ext = name.includes('.') ? name.split('.').pop() : '';
  return COMMON_IMAGE_EXTENSIONS.has(ext);
}

function loadImageFile(file){
  return new Promise((resolve, reject)=>{
    if(!isImageFile(file)) return reject(new Error('Unsupported file type'));
    const objectUrl = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      URL.revokeObjectURL(objectUrl);
      resolve(img);
    };
    img.onerror = ()=>{
      URL.revokeObjectURL(objectUrl);
      reject(new Error('This image format is not supported by the current browser.'));
    };
    img.src = objectUrl;
  });
}

async function addPhotos(fileList){
  const files = [...(fileList || [])].filter(isImageFile);
  for(const file of files){
    try{
      const img = await loadImageFile(file);
      state.photos.push({id: crypto.randomUUID(), name:file.name || 'Pasted image', img, spots:[], crop:null, edit:DEFAULT_EDIT()});
      if(state.activeIndex===-1) state.activeIndex = 0;
      renderThumbs();
      renderStageVisibility();
      render();
      pushHistory();
    }catch(err){
      console.warn('Duskreel could not open image:', file?.name, err);
    }
  }
}"""

          if old not in s:
              raise SystemExit('photo input handler pattern not found')
          if old2 not in s:
              raise SystemExit('addPhotos pattern not found')

          s = s.replace(old, new, 1).replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit update and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-image-import-update.yml
          git add index.html .github/workflows/one-time-image-import-update.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: support more image import formats"
          git push